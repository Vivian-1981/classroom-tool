<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据看板 · 课堂分组系统</title>
<script src="supabase.js"></script>
<script src="config.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root { --bg:#0f1117; --card:#1a1d27; --border:#2a2d3a; --accent:#6366f1; --green:#10b981; --warn:#f59e0b; --text:#e2e8f0; --muted:#64748b; --white:#fff; }
body { background:var(--bg); color:var(--text); font-family:-apple-system,'PingFang SC',sans-serif; min-height:100vh; padding-bottom:40px; }

/* ── Top bar ── */
.topbar { background:var(--card); border-bottom:1px solid var(--border); padding:14px 20px; display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:100; }
.topbar h1 { font-size:17px; font-weight:700; color:var(--white); flex:1; }
.back-btn { background:none; border:1px solid var(--border); color:var(--text); padding:6px 12px; border-radius:8px; font-size:13px; cursor:pointer; display:none; }

/* ── Section ── */
.section { padding:20px; }
.section-title { font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--accent); margin-bottom:14px; }

/* ── Session list ── */
.sess-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px 18px; margin-bottom:12px; cursor:pointer; transition:border-color .15s; display:flex; align-items:center; gap:16px; }
.sess-card:active { border-color:var(--accent); }
.sess-info { flex:1; }
.sess-label { font-size:16px; font-weight:600; color:var(--white); margin-bottom:4px; }
.sess-date  { font-size:13px; color:var(--muted); }
.sess-stats { display:flex; gap:16px; flex-shrink:0; text-align:center; }
.stat { display:flex; flex-direction:column; align-items:center; }
.stat-num  { font-size:20px; font-weight:700; color:var(--white); }
.stat-label{ font-size:11px; color:var(--muted); margin-top:2px; }
.stat-num.green { color:var(--green); }
.arrow { color:var(--muted); font-size:18px; }

/* ── Detail ── */
.detail-section { margin-bottom:24px; }
.detail-section h3 { font-size:15px; font-weight:600; color:var(--white); margin-bottom:12px; padding-bottom:8px; border-bottom:1px solid var(--border); }

/* ── Attendance ── */
.attend-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.attend-item { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:10px 12px; display:flex; justify-content:space-between; align-items:center; font-size:15px; }
.badge { font-size:11px; padding:2px 8px; border-radius:99px; }
.badge-f { background:rgba(34,211,238,.15); color:#22d3ee; }
.badge-m { background:rgba(99,102,241,.2); color:var(--accent); }
.badge-time { font-size:11px; color:var(--muted); }

/* ── Groups ── */
.groups-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.grp-card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px; }
.grp-num { font-size:11px; color:var(--accent); font-weight:700; letter-spacing:1px; margin-bottom:8px; }
.grp-names { font-size:14px; line-height:1.8; }

/* ── Scores ── */
.score-card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px 16px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:flex-start; }
.score-left h4 { font-size:15px; font-weight:600; color:var(--white); margin-bottom:4px; }
.score-left p  { font-size:14px; color:var(--muted); }
.score-num { font-size:28px; font-weight:800; color:var(--green); }

/* ── Peer scores ── */
.peer-list { display:flex; flex-direction:column; gap:8px; }
.peer-item { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:12px 14px; }
.peer-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
.peer-from { font-size:13px; color:var(--muted); }
.peer-rxn  { font-size:15px; }
.peer-comment { font-size:14px; color:var(--text); margin-top:4px; }

/* ── Empty ── */
.empty { text-align:center; padding:40px; color:var(--muted); font-size:15px; }

/* ── Summary bar ── */
.summary-bar { display:flex; gap:0; background:var(--card); border:1px solid var(--border); border-radius:12px; overflow:hidden; margin-bottom:20px; }
.sum-item { flex:1; padding:16px; text-align:center; border-right:1px solid var(--border); }
.sum-item:last-child { border-right:none; }
.sum-num   { font-size:26px; font-weight:800; color:var(--white); }
.sum-label { font-size:12px; color:var(--muted); margin-top:4px; }

/* ── Nav link ── */
.nav-link { display:block; text-align:center; padding:14px; background:var(--card); border:1px solid var(--border); border-radius:10px; color:var(--accent); text-decoration:none; font-size:15px; font-weight:600; margin:20px; }
</style>
</head>
<body>

<div class="topbar">
  <button class="back-btn" id="backBtn" onclick="showList()">← 返回</button>
  <h1 id="topTitle">📊 数据看板</h1>
</div>

<!-- 课堂列表 -->
<div id="listView">
  <div class="section">
    <div class="section-title">所有课堂记录</div>
    <div id="summaryBar" style="display:none;">
      <div class="summary-bar">
        <div class="sum-item"><div class="sum-num" id="totalSess">-</div><div class="sum-label">总课堂数</div></div>
        <div class="sum-item"><div class="sum-num" id="totalAttend">-</div><div class="sum-label">累计签到</div></div>
        <div class="sum-item"><div class="sum-num green" id="avgScore">-</div><div class="sum-label">平均分</div></div>
      </div>
    </div>
    <div id="sessList"><div class="empty">加载中…</div></div>
  </div>
  <a href="teacher.html" class="nav-link">← 返回老师端</a>
</div>

<!-- 课堂详情 -->
<div id="detailView" style="display:none;">
  <div class="section">
    <!-- 签到 -->
    <div class="detail-section">
      <h3>📋 签到名单 <span id="detailAttendCount" style="font-size:14px;color:var(--muted);font-weight:400;"></span></h3>
      <div class="attend-grid" id="detailAttend"></div>
    </div>
    <!-- 分组 -->
    <div class="detail-section">
      <h3>👥 分组结果</h3>
      <div class="groups-grid" id="detailGroups"></div>
    </div>
    <!-- 老师评分 -->
    <div class="detail-section">
      <h3>📝 老师评分</h3>
      <div id="detailScores"></div>
    </div>
    <!-- 互评 -->
    <div class="detail-section">
      <h3>⭐ 学生互评</h3>
      <div class="peer-list" id="detailPeers"></div>
    </div>
  </div>
</div>

<script>
initSB();

// ── 课堂列表 ─────────────────────────────────────────────────────
async function loadList() {
  const { data: sessions } = await sb
    .from("class_sessions")
    .select("*")
    .order("created_at", { ascending: false });

  if (!sessions || !sessions.length) {
    document.getElementById("sessList").innerHTML = '<div class="empty">暂无课堂记录</div>';
    return;
  }

  // 汇总统计
  let totalAttend = 0, scoreSum = 0, scoreCount = 0;

  // 每个 session 查出勤数和平均分
  const cards = await Promise.all(sessions.map(async sess => {
    const { count: attendCount } = await sb
      .from("attendance")
      .select("*", { count: "exact", head: true })
      .eq("session_id", sess.id);

    const { data: scores } = await sb
      .from("teacher_scores")
      .select("score")
      .eq("session_id", sess.id);

    const avgScore = scores && scores.length
      ? (scores.reduce((s, r) => s + r.score, 0) / scores.length).toFixed(1)
      : null;

    totalAttend += attendCount || 0;
    if (avgScore) { scoreSum += parseFloat(avgScore); scoreCount++; }

    const date = new Date(sess.created_at).toLocaleDateString("zh-CN", { month:"numeric", day:"numeric", hour:"2-digit", minute:"2-digit" });

    return `<div class="sess-card" onclick="loadDetail('${sess.id}','${sess.label}')">
      <div class="sess-info">
        <div class="sess-label">${sess.label || "未命名课堂"}</div>
        <div class="sess-date">${date}</div>
      </div>
      <div class="sess-stats">
        <div class="stat">
          <div class="stat-num">${attendCount || 0}</div>
          <div class="stat-label">到课</div>
        </div>
        ${avgScore ? `<div class="stat">
          <div class="stat-num green">${avgScore}</div>
          <div class="stat-label">均分</div>
        </div>` : ""}
      </div>
      <div class="arrow">›</div>
    </div>`;
  }));

  document.getElementById("sessList").innerHTML = cards.join("");

  // 显示汇总
  document.getElementById("totalSess").textContent = sessions.length;
  document.getElementById("totalAttend").textContent = totalAttend;
  document.getElementById("avgScore").textContent = scoreCount ? (scoreSum / scoreCount).toFixed(1) : "—";
  document.getElementById("summaryBar").style.display = "";
}

// ── 课堂详情 ─────────────────────────────────────────────────────
async function loadDetail(sessId, label) {
  document.getElementById("listView").style.display = "none";
  document.getElementById("detailView").style.display = "";
  document.getElementById("backBtn").style.display = "inline-flex";
  document.getElementById("topTitle").textContent = label || "课堂详情";

  // 签到
  const { data: attend } = await sb
    .from("attendance").select("*").eq("session_id", sessId).order("created_at");
  document.getElementById("detailAttendCount").textContent = `（${attend?.length || 0} 人）`;
  document.getElementById("detailAttend").innerHTML = attend?.length
    ? attend.map(a => `
      <div class="attend-item">
        <span>${a.name}</span>
        <div style="display:flex;gap:6px;align-items:center;">
          <span class="badge ${a.gender==="M"?"badge-m":"badge-f"}">${a.gender==="M"?"男":"女"}</span>
          <span class="badge-time">${a.created_at?.slice(11,16)||""}</span>
        </div>
      </div>`).join("")
    : '<div class="empty">无签到记录</div>';

  // 分组
  const { data: groups } = await sb
    .from("groups").select("*").eq("session_id", sessId).order("group_num");
  document.getElementById("detailGroups").innerHTML = groups?.length
    ? groups.map(g => {
        const members = JSON.parse(g.members);
        return `<div class="grp-card">
          <div class="grp-num">第 ${g.group_num} 组 · ${members.length}人</div>
          <div class="grp-names">${members.join("<br>")}</div>
        </div>`;
      }).join("")
    : '<div class="empty" style="grid-column:1/-1">未分组</div>';

  // 老师评分
  const { data: scores } = await sb
    .from("teacher_scores").select("*, groups(group_num, members)").eq("session_id", sessId);
  document.getElementById("detailScores").innerHTML = scores?.length
    ? scores.map(s => {
        const members = s.groups ? JSON.parse(s.groups.members) : [];
        return `<div class="score-card">
          <div class="score-left">
            <h4>第 ${s.groups?.group_num || "?"} 组</h4>
            <p>${members.join("、") || ""}</p>
            ${s.comment ? `<p style="margin-top:6px;color:var(--text);">${s.comment}</p>` : ""}
          </div>
          <div class="score-num">${s.score}</div>
        </div>`;
      }).join("")
    : '<div class="empty">暂无评分</div>';

  // 互评
  const { data: peers } = await sb
    .from("peer_scores").select("*, groups(group_num)").eq("session_id", sessId).order("created_at");
  document.getElementById("detailPeers").innerHTML = peers?.length
    ? peers.map(p => `
      <div class="peer-item">
        <div class="peer-header">
          <span class="peer-from">${p.from_name} → 第 ${p.groups?.group_num || "?"}组</span>
          <span class="peer-rxn">${p.reaction || ""}</span>
        </div>
        ${p.comment ? `<div class="peer-comment">${p.comment}</div>` : ""}
      </div>`).join("")
    : '<div class="empty">暂无互评</div>';
}

function showList() {
  document.getElementById("listView").style.display = "";
  document.getElementById("detailView").style.display = "none";
  document.getElementById("backBtn").style.display = "none";
  document.getElementById("topTitle").textContent = "📊 数据看板";
}

loadList();
</script>
</body>
</html>
